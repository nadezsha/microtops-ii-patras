name: Process Microtops data

on:
  push:
    paths:
      - "data/raw/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/process-data.yml"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion
        run: |
          python scripts/ingest.py

      - name: Commit processed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/microtops_raw_master.csv

          if git diff --cached --quiet; then
            echo "No processed-data changes to commit."
          else
            git commit -m "Update processed Microtops dataset"
            git push
          fi

      - name: Upload processed dataset as artifact
        uses: actions/upload-artifact@v4
        with:
          name: microtops-processed-data
          path: data/processed/microtops_raw_master.csv
